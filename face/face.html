    <script>
        const rowsPerPage = 5; // Số hàng mỗi trang
        let currentPage = 1; // Trang hiện tại
        let resultsData = []; // Mảng để lưu trữ dữ liệu kết quả

        // Function to read the CSV file
        function loadCSVFile() {
            fetch('detection_info.csv')
                .then(response => response.text()) // Get the CSV file as text
                .then(csvText => {
                    const rows = csvText.split('\n'); // Split by newlines to get rows

                    // Iterate through the rows (skipping the header)
                    rows.slice(1).forEach(row => {
                        const columns = row.split(','); // Split by commas to get columns
                        if (columns.length < 4) return; // Skip rows that don't have đủ cột
                        resultsData.push(columns); // Thêm hàng vào mảng dữ liệu
                    });

                    // Hiển thị trang đầu tiên
                    displayPage(currentPage);
                })
                .catch(error => console.error('Error loading CSV file:', error));
        }

        // Function to display a specific page
        function displayPage(page) {
            const tbody = document.querySelector('#results tbody');
            tbody.innerHTML = ''; // Xóa dữ liệu cũ

            // Tính chỉ số bắt đầu và kết thúc của hàng
            const start = (page - 1) * rowsPerPage;
            const end = start + rowsPerPage;
            const pageData = resultsData.slice(start, end); // Lấy dữ liệu cho trang hiện tại

            // Tạo hàng cho bảng
            pageData.forEach(columns => {
                const tableRow = document.createElement('tr');

                // Name column
                const nameCell = document.createElement('td');
                nameCell.textContent = columns[1]; // Tên người
                tableRow.appendChild(nameCell);

                // Timestamp column
                const timestampCell = document.createElement('td');
                timestampCell.textContent = columns[2]; // Dấu thời gian
                tableRow.appendChild(timestampCell);

                // Detected Face column
                const imgCell = document.createElement('td');
                const img = document.createElement('img');
                img.src = `static/images/${columns[0]}`;  // Tên file ảnh khuôn mặt
                img.alt = `Detected face of ${columns[1]}`;
                imgCell.appendChild(img);
                tableRow.appendChild(imgCell);

                // Full Image column
                const fullImgCell = document.createElement('td');
                fullImgCell.className = "full-image"; // Add the class for styling
                const fullImg = document.createElement('img');
                fullImg.src = `static/images/${columns[3]}`; // Tên file ảnh toàn cảnh
                fullImg.alt = `Full image of ${columns[1]}`;
                fullImgCell.appendChild(fullImg);
                tableRow.appendChild(fullImgCell);

                // Append the row to the table body
                tbody.appendChild(tableRow);
            });

            // Cập nhật phân trang
            updatePagination();
        }

        function updatePagination() {
    const pagination = document.getElementById('pagination');
    pagination.innerHTML = ''; // Xóa phân trang cũ

    const totalPages = Math.ceil(resultsData.length / rowsPerPage); // Tổng số trang
    const maxPagesToShow = 5; // Số trang hiển thị xung quanh trang hiện tại
    const pageLinks = [];

    if (currentPage > 1) {
        const prevLink = document.createElement('span');
        prevLink.textContent = '←';
        prevLink.className = 'page-link';
        prevLink.onclick = () => {
            currentPage--;
            displayPage(currentPage);
        };
        pageLinks.push(prevLink);
    }

    if (currentPage > 3) {
        const firstPage = document.createElement('span');
        firstPage.textContent = '1';
        firstPage.className = 'page-link';
        firstPage.onclick = () => {
            currentPage = 1;
            displayPage(currentPage);
        };
        pageLinks.push(firstPage);

        if (currentPage > 4) {
            const dots = document.createElement('span');
            dots.textContent = '..';
            dots.className = 'page-link';
            pageLinks.push(dots);
        }
    }

    const startPage = Math.max(1, currentPage - 2);
    const endPage = Math.min(totalPages, currentPage + 2);

    for (let i = startPage; i <= endPage; i++) {
        const pageLink = document.createElement('span');
        pageLink.textContent = i;
        pageLink.className = 'page-link' + (i === currentPage ? ' active' : '');
        pageLink.onclick = () => {
            currentPage = i;
            displayPage(currentPage);
        };
        pageLinks.push(pageLink);
    }

    if (currentPage < totalPages - 2) {
        if (currentPage < totalPages - 3) {
            const dots = document.createElement('span');
            dots.textContent = '..';
            dots.className = 'page-link';
            pageLinks.push(dots);
        }

        const lastPage = document.createElement('span');
        lastPage.textContent = totalPages;
        lastPage.className = 'page-link';
        lastPage.onclick = () => {
            currentPage = totalPages;
            displayPage(currentPage);
        };
        pageLinks.push(lastPage);
    }

    if (currentPage < totalPages) {
        const nextLink = document.createElement('span');
        nextLink.textContent = '→';
        nextLink.className = 'page-link';
        nextLink.onclick = () => {
            currentPage++;
            displayPage(currentPage);
        };
        pageLinks.push(nextLink);
    }

    // Append tất cả các phần tử phân trang vào `pagination`
    pageLinks.forEach(link => pagination.appendChild(link));
}


        // Load the CSV file when the page loads
        window.onload = loadCSVFile;
    </script>

    <script>

        let toggle = document.querySelector('.toggle');

        toggle.onclick = function(){
            navigation.classList.toggle('active');
            main.classList.toggle('active');
            toggle.classList.toggle('active');
        }

        // add hovered class in selected list item
        let list = document.querySelectorAll('.navigation li');
        function activeLink(){
            list.forEach((item) =>
            item.classList.remove('hovered'));
            this.classList.add('hovered');
        }
        list.forEach((item) => 
        item.addEventListener('mouseover',activeLink));
    </script>

<script>

        var content1 = document.getElementById('content1');
        var content2 = document.getElementById('content2');
        if (content1.style.display === 'none') {
            content1.style.display = 'block';
            content2.style.display = 'none';
        } else {
            content1.style.display = 'none';
            content2.style.display = 'block';
        }
    }
</script>
