<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Face Detection Results nè</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: center;
        }
        th {
            background-color: #f2f2f2;
        }
        img {
            width: 150px;
            height: auto;
        }
        .full-image img {
            min-width: 200px;
            width: auto;
            height: auto;
        }
        #pagination {
            margin-top: 20px;
            text-align: center;
        }
        .page-link {
            margin: 0 5px;
            cursor: pointer;
            padding: 5px 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            background-color: #f9f9f9;
        }
        .page-link.active {
            background-color: #007bff;
            color: white;
        }
    </style>
</head>
<body>
    <h1>Face Detection Results</h1>
    <table id="results">
        <thead>
            <tr>
                <th>Name</th>
                <th>Timestamp</th>
                <th>Detected Face</th>
                <th class="full-image">Full Image</th>
            </tr>
        </thead>
        <tbody>
        </tbody>
    </table>

    <div id="pagination"></div>

    <script>
        const rowsPerPage = 5;
        let currentPage = 1;
        let resultsData = [];

        function loadCSVFile() {
            fetch('detection_info.csv')
                .then(response => response.text())
                .then(csvText => {
                    const rows = csvText.split('\n');

                    rows.slice(1).forEach(row => {
                        const columns = row.split(',');
                        if (columns.length < 4) return;
                        resultsData.push(columns);
                    });

                    displayPage(currentPage);
                })
                .catch(error => console.error('Error loading CSV file:', error));
        }

        function displayPage(page) {
            const tbody = document.querySelector('#results tbody');
            tbody.innerHTML = '';

            const start = (page - 1) * rowsPerPage;
            const end = start + rowsPerPage;
            const pageData = resultsData.slice(start, end);

            pageData.forEach(columns => {
                const tableRow = document.createElement('tr');

                const nameCell = document.createElement('td');
                nameCell.textContent = columns[1]; 
                tableRow.appendChild(nameCell);

                const timestampCell = document.createElement('td');
                timestampCell.textContent = columns[2];
                tableRow.appendChild(timestampCell);

                const imgCell = document.createElement('td');
                const img = document.createElement('img');
                img.src = `static/images/${columns[0]}`;
                img.alt = `Detected face of ${columns[1]}`;
                imgCell.appendChild(img);
                tableRow.appendChild(imgCell);

                const fullImgCell = document.createElement('td');
                fullImgCell.className = "full-image";
                const fullImg = document.createElement('img');
                fullImg.src = `static/images/${columns[3]}`;
                fullImg.alt = `Full image of ${columns[1]}`;
                fullImgCell.appendChild(fullImg);
                tableRow.appendChild(fullImgCell);

                tbody.appendChild(tableRow);
            });

            updatePagination();
        }

        function updatePagination() {
    const pagination = document.getElementById('pagination');
    pagination.innerHTML = '';

    const totalPages = Math.ceil(resultsData.length / rowsPerPage);
    const maxPagesToShow = 5;
    const pageLinks = [];

    if (currentPage > 1) {
        const prevLink = document.createElement('span');
        prevLink.textContent = '←';
        prevLink.className = 'page-link';
        prevLink.onclick = () => {
            currentPage--;
            displayPage(currentPage);
        };
        pageLinks.push(prevLink);
    }

    if (currentPage > 3) {
        const firstPage = document.createElement('span');
        firstPage.textContent = '1';
        firstPage.className = 'page-link';
        firstPage.onclick = () => {
            currentPage = 1;
            displayPage(currentPage);
        };
        pageLinks.push(firstPage);

        if (currentPage > 4) {
            const dots = document.createElement('span');
            dots.textContent = '..';
            dots.className = 'page-link';
            pageLinks.push(dots);
        }
    }

    const startPage = Math.max(1, currentPage - 2);
    const endPage = Math.min(totalPages, currentPage + 2);

    for (let i = startPage; i <= endPage; i++) {
        const pageLink = document.createElement('span');
        pageLink.textContent = i;
        pageLink.className = 'page-link' + (i === currentPage ? ' active' : '');
        pageLink.onclick = () => {
            currentPage = i;
            displayPage(currentPage);
        };
        pageLinks.push(pageLink);
    }

    if (currentPage < totalPages - 2) {
        if (currentPage < totalPages - 3) {
            const dots = document.createElement('span');
            dots.textContent = '..';
            dots.className = 'page-link';
            pageLinks.push(dots);
        }

        const lastPage = document.createElement('span');
        lastPage.textContent = totalPages;
        lastPage.className = 'page-link';
        lastPage.onclick = () => {
            currentPage = totalPages;
            displayPage(currentPage);
        };
        pageLinks.push(lastPage);
    }

    if (currentPage < totalPages) {
        const nextLink = document.createElement('span');
        nextLink.textContent = '→';
        nextLink.className = 'page-link';
        nextLink.onclick = () => {
            currentPage++;
            displayPage(currentPage);
        };
        pageLinks.push(nextLink);
    }

    pageLinks.forEach(link => pagination.appendChild(link));
}
        window.onload = loadCSVFile;
    </script>
</body>
</html>
