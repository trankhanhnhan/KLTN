<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Stream</title>
</head>
<body>
    <h1>ESP32-CAM Video Stream</h1>
    <img id="video" width="640" height="480" alt="Stream not available" />
    
    <!-- Load Socket.io client -->
    <script src="https://cdn.socket.io/4.0.0/socket.io.min.js"></script>
    
    <script>
        // Kết nối đến server Flask qua WebSocket
        const socket = io.connect("https://kltn-ahwx.onrender.com");

        // Lắng nghe sự kiện 'video_stream' từ server
        socket.on('video_stream', function(data) {
            const img = document.getElementById('video');
            
            // Chuyển dữ liệu ảnh byte thành Blob và tạo URL để hiển thị ảnh
            const blob = new Blob([new Uint8Array(data.frame)], { type: 'image/jpeg' });
            img.src = URL.createObjectURL(blob);
        });
    </script>
</body>
</html>
